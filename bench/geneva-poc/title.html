<!-- Documentary title card — scene 1 opening. Plays the same in a browser. -->
<style>
  @keyframes title-in  { from { opacity: 0 } to { opacity: 1 } }
  @keyframes spread-in { from { letter-spacing: 26px } to { letter-spacing: 4px } }
  @keyframes rule-in   { from { scale: 0 1 }             to { scale: 1 1 } }
  @keyframes sub-in    { from { opacity: 0; translate: 0 14px } to { opacity: 1; translate: 0 0 } }
  @keyframes title-out { from { opacity: 1 } to { opacity: 0 } }

  .clip { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .wrap {
    animation: title-in 1.1s ease-out, title-out 0.6s 7.4s;
    position: absolute; left: 0; right: 0; top: 38%;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .wrap h1 {
    animation: spread-in 1.1s ease-out both;
    margin: 0; font: 700 92px 'Liberation Serif', serif;
    letter-spacing: 4px; color: #f2f5f7;
    text-shadow: 0 4px 26px #000000a8;
  }
  .rule {
    animation: rule-in 0.9s 0.5s both ease-out;
    width: 320px; height: 5px; background: #c4362f;
  }
  .wrap p {
    animation: sub-in 0.9s 0.8s both ease-out;
    margin: 0; font: 600 26px 'Liberation Sans', sans-serif;
    letter-spacing: 7px; color: #c8d4dd;
  }
</style>
<div class="clip">
  <div class="wrap">
    <h1>THE ISDAL WOMAN</h1>
    <div class="rule"></div>
    <p>THE WOMAN WHO ERASED HER OWN IDENTITY</p>
  </div>
</div>
