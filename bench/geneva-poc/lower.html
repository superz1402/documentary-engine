<!-- Evidence card + lower third — scene 2. Plays the same in a browser. -->
<style>
  @keyframes card-in   { from { opacity: 0; translate: -40px 0 } to { opacity: 1; translate: 0 0 } }
  @keyframes stamp-in  { from { opacity: 0; scale: 1.6 }         to { opacity: 1; scale: 1 } }
  @keyframes lt-in     { from { translate: -100% }              to { translate: 0 } }
  @keyframes lt-out    { from { opacity: 1 }                    to { opacity: 0 } }

  .evidence {
    animation: card-in 0.55s 0.4s both ease-out;
    position: absolute; left: 6%; top: 16%; width: 460px;
    background: #f3f6f8f2; border: 2px solid #13202e; border-radius: 10px;
    padding: 22px 26px; box-shadow: 0 10px 34px #00000059;
  }
  .evidence h2 { margin: 0 0 10px; font: 700 30px 'Liberation Sans'; color: #13202e; }
  .evidence ul { margin: 0; padding-left: 22px; font: 500 21px/1.5 'Liberation Sans'; color: #33465a; }
  .stamp {
    animation: stamp-in 0.4s 1.3s both ease-out;
    position: absolute; right: 30px; top: -18px;
    font: 700 22px 'Liberation Mono', monospace; letter-spacing: 3px;
    color: #a63d33; border: 4px solid #a63d33; border-radius: 6px;
    padding: 6px 14px; transform: rotate(-6deg); background: #f3f6f8f2;
  }
  .lower {
    animation: lt-in 0.5s 0.6s both ease-out, lt-out 0.5s 5.6s both;
    position: absolute; left: 4.4%; bottom: 8%;
    display: flex; flex-direction: column; gap: 6px;
    padding: 14px 24px; background: #0a0f14cc; border-left: 5px solid #c4362f;
    box-shadow: 0 4px 18px #00000059;
  }
  .lower h1 { margin: 0; font: 600 30px 'Liberation Sans'; color: #f2f5f7; }
  .lower p  { margin: 0; font: 500 15px 'Liberation Sans'; letter-spacing: 1.6px; color: #94a6b6; }
</style>
<div class="evidence">
  <div class="stamp">CASE 134/70</div>
  <h2>THE SUITCASES</h2>
  <ul>
    <li>Two suitcases, Bergen station</li>
    <li>Every label cut away</li>
    <li>500 DM sewn into the lining</li>
  </ul>
</div>
<div class="lower">
  <h1>Isdalen, Norway</h1>
  <p>NOVEMBER 1970 &middot; CASE FILE 134/70</p>
</div>
